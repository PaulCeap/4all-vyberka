name: Denní monitoring zakázek

on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-tenders
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Načíst a vyhodnotit nové zakázky
        run: npm run agent
      - name: Uložit aktualizovaná data
        run: |
          if git diff --quiet -- public/data/tenders.json; then
            echo "Žádná změna dat."
            exit 0
          fi
          git config user.name "4ALL Výběrka Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/tenders.json
          git commit -m "data: denní aktualizace zakázek"
          git push
      - name: Upozornit e-mailem na nové příležitosti
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAILS: ${{ secrets.ALERT_EMAILS }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}
        run: npm run notify
