<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Přehled zakázek pro 4all.">
    <meta name="theme-color" content="#f7f7f5">
    <meta property="og:title" content="Výběrka · Redakce 4all">
    <meta property="og:description" content="Přehled zakázek pro 4all.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://vyberka.4all.cz">
    <title>Výběrka · Redakce 4all</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./app.js" type="module"></script>
  </head>
  <body>
    <a class="skip-link" href="#opportunities">Přeskočit na zakázky</a>
    <header class="site-header">
      <a class="brand" href="https://redakce.4all.cz/" aria-label="4all Redakce — domů">
        <strong>4all</strong>
        <span class="brand-colors" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      </a>
      <span class="app-label">redakce</span>
      <nav aria-label="Hlavní navigace">
        <a class="nav-home" href="https://redakce.4all.cz/">Domů</a>
        <a href="https://redakce.4all.cz/pr">PR</a>
        <a href="https://redakce.4all.cz/blog">Blog</a>
        <a class="nav-active" href="./" aria-current="page">Výběrka</a>
      </nav>
      <a class="nav-external" href="https://4all.cz/" target="_blank" rel="noreferrer">Web ↗</a>
    </header>

    <main>
      <section class="opportunities" id="opportunities" aria-labelledby="opportunities-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">PŘEHLED PŘÍLEŽITOSTÍ</p>
            <h1 id="opportunities-title">Výběrka</h1>
          </div>
          <p class="updated" id="updated-at">Načítám poslední aktualizaci…</p>
        </div>

        <div class="overview-stats" aria-label="Souhrn zakázek">
          <div><strong id="stat-total">—</strong><span>Aktivních tipů</span></div>
          <div><strong id="stat-strong">—</strong><span>Silná shoda</span></div>
          <div><strong id="stat-soon">—</strong><span>Končí do 7 dní</span></div>
        </div>

        <details class="processing-panel" id="processing" hidden></details>

        <div class="toolbar" aria-label="Filtrování zakázek">
          <label class="search-field">
            <span class="sr-only">Hledat v zakázkách</span>
            <span aria-hidden="true">⌕</span>
            <input id="search" type="search" placeholder="Hledat zakázku nebo zadavatele…" autocomplete="off">
          </label>
          <label class="select-field">
            <span>Typ</span>
            <select id="type-filter">
              <option value="all">Všechny příležitosti</option>
              <option value="public-tender">Veřejné zakázky</option>
              <option value="commercial-demand">Poptávky</option>
              <option value="market-signal">Komerční tendry</option>
            </select>
          </label>
          <label class="select-field">
            <span>Min. shoda</span>
            <select id="score-filter">
              <option value="42">Všechny tipy</option>
              <option value="55">Dobrá shoda 55+</option>
              <option value="75">Silná shoda 75+</option>
            </select>
          </label>
          <label class="select-field">
            <span>Řazení</span>
            <select id="sort">
              <option value="score">Nejlepší shoda</option>
              <option value="deadline">Nejbližší deadline</option>
              <option value="newest">Nejnovější</option>
            </select>
          </label>
          <button class="saved-filter" id="saved-filter" type="button" aria-pressed="false">☆ Uložené</button>
        </div>

        <div class="category-chips" id="category-chips" aria-label="Kategorie služeb">
          <button type="button" class="chip active" data-category="all" aria-pressed="true">Vše</button>
          <button type="button" class="chip" data-category="content" aria-pressed="false">Obsah</button>
          <button type="button" class="chip" data-category="pr" aria-pressed="false">PR & komunikace</button>
          <button type="button" class="chip" data-category="marketing" aria-pressed="false">Marketing & eventy</button>
          <button type="button" class="chip" data-category="strategy" aria-pressed="false">Strategie</button>
          <button type="button" class="chip" data-category="ai" aria-pressed="false">AI & automatizace</button>
          <button type="button" class="chip" data-category="training" aria-pressed="false">Školení</button>
        </div>

        <p class="result-count" id="result-count" aria-live="polite"></p>
        <div class="tender-list" id="tender-list" aria-busy="true">
          <div class="loading-card"></div>
          <div class="loading-card"></div>
          <div class="loading-card"></div>
        </div>
        <div class="empty-state" id="empty-state" hidden>
          <span aria-hidden="true">∅</span>
          <h3>V tomhle filtru zatím nic není.</h3>
          <p>Zkuste snížit minimální shodu nebo změnit kategorii.</p>
          <button type="button" id="reset-filters">Zobrazit všechny tipy</button>
        </div>
      </section>

    </main>

    <footer>
      <span>4all · Výběrka</span>
      <a href="https://redakce.4all.cz/">Zpět do redakce ↑</a>
    </footer>
  </body>
</html>
